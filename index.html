    .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}.section-title{display:flex;align-items:center;gap:10px}.section-title h2{font:700 20px Manrope;letter-spacing:-.5px;margin:0}.section-title p{font-size:12px;color:var(--muted);margin:4px 0 0}.actions{display:flex;gap:9px;align-items:center}.search{position:relative}.search input{width:205px;padding:10px 12px 10px 33px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;font-size:12px}.search input:focus,.cell-input:focus,.cell-select:focus{border-color:#92ad9a;box-shadow:0 0 0 3px #345e4b12}.search-icon{position:absolute;left:11px;top:10px;color:#929b94;font-size:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:21px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px;display:flex;justify-content:space-between;align-items:center}.stat-label{color:var(--muted);font-size:11px}.stat-value{font:700 22px Manrope;letter-spacing:-.7px;margin-top:4px}.stat-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:15px}.ic-green{background:var(--green2);color:var(--green)}.ic-amber{background:var(--amber2);color:var(--amber)}.ic-blue{background:var(--blue2);color:var(--blue)}

flex;align-items:center;justify-content:center;gap:5px;color:#818b83;font-size:10px;white-space:nowrap;cursor:pointer}.today-toggle input{accent-color:var(--amber);margin:0}.date-input{font-size:11px;padding:7px 5px}.row-delete{border:0;background:transparent;color:#aab1ab;font-size:16px;border-radius:5px;width:28px;height:28px;opacity:.55}.task-row:hover .row-delete{opacity:1}.row-delete:hover{background:#fbece9;color:var(--red)}.section-label{padding:14px 18px 8px;display:flex;align-items:center;gap:8px;color:#69766c;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.1px;background:#fff}.section-label:after{content:'';height:1px;background:var(--line);flex:1}.today-section .section-label:after{background:#eadfc7}.add-row{display:flex;align-items:center;gap:7px;border:0;background:#fff;color:#7c887e;width:100%;padding:13px 18px;text-align:left;font-size:12px;font-weight:600}.add-row:hover{background:#fafbf8;color:var(--green)}.add-plus{font-size:17px;color:var(--green);font-weight:400}.meeting-head{grid-template-columns:minmax(240px,1.5fr) minmax(180px,1fr) 34px}.meeting-row{grid-template-columns:minmax(240px,1.5fr) minmax(180px,1fr) 34px}.meeting-summary{display:flex;gap:8px;margin:14px 0 18px;flex-wrap:wrap}.meeting-summary .mini{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:11px;color:var(--muted)}.mini b{color:var(--ink);margin-right:4px}.empty{padding:35px 20px;text-align:center;color:var(--muted);font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#25392d;color:#fff;padding:10px 15px;border-radius:9px;font-size:12px;z-index:12;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:900px){.app{padding:22px 20px}.list-head{display:none}.task-row{grid-template-columns:minmax(0,1fr) 28px;gap:5px 8px;padding:10px 13px;position:relative}.task-main{grid-column:1;grid-row:1}.task-row .boss-cell,.task-row .status-cell,.task-row .deadline-cell,.task-row .today-cell,.task-row .meeting-notes-cell{grid-row:2}.task-row .boss-cell{grid-column:1}.task-row .status-cell{grid-column:1;margin-left:2px}.task-row .deadline-cell{grid-column:1}.task-row .today-cell{grid-column:1;justify-content:flex-start;margin-left:5px}.task-row .row-delete{grid-column:2;grid-row:1}.task-row.meeting-row{grid-template-columns:minmax(0,1fr) 28px}.meeting-row .meeting-title{grid-column:1;grid-row:1}.meeting-row .meeting-status-cell{grid-column:1;grid-row:2}.meeting-row .meeting-notes-cell{grid-column:1;grid-row:3}.meeting-row .row-delete{grid-column:2;grid-row:1}.list-card{overflow:visible}.task-row .cell-select,.task-row .date-input{max-width:210px}.today-note{display:none}}
    .progress-select{font-weight:600}.tone-started{background-color:#f0f1ef;color:#636d65}.tone-in-progress{background-color:#eaf2f8;color:#456b87}.tone-done{background-color:#eaf2ec;color:#345e4b}.tone-on-me{background-color:#fbf0df;color:#a56824}.tone-waiting{background-color:#f2eef6;color:#77638e}.tone-times-sent{background-color:#edf3f7;color:#456b87}.tone-sent{background-color:#eaf2ec;color:#52765f}.tone-custom{background-color:#f1f2ef;color:#626d65}.select-add-wrap{display:flex;align-items:center;gap:3px;min-width:0}.select-add-wrap .cell-select{flex:1}.add-option{flex:none;width:25px;height:27px;border:1px solid #e5e9e3;background:#fff;color:var(--green);border-radius:6px;font-size:17px;line-height:1}.add-option:hover{background:var(--green2)}.option-editor{display:flex;gap:4px;position:absolute;z-index:4;background:#fff;padding:6px;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:215px;margin-top:4px}.select-add-wrap{position:relative}.option-editor input{width:130px;border:1px solid var(--line);border-radius:5px;padding:6px;font-size:11px}.option-editor button{border:0;border-radius:5px;background:var(--green);color:#fff;font-size:10px;padding:5px 7px}.option-editor button.cancel-option{background:#f1f2ef;color:#58645c}.meeting-head{grid-template-columns:minmax(300px,1.7fr) 190px 175px 34px}.meeting-row{grid-template-columns:minmax(300px,1.7fr) 190px 175px 34px}.meeting-title-line{display:flex;gap:4px;align-items:center}.meeting-title-line .cell-input{flex:1;min-width:60px}.meeting-mode-cell .cell-select{font-size:11px}.address-input{font-size:11px;color:#657169;padding-top:3px;padding-bottom:3px}.followup-button{font-size:9px}
    @media(max-width:900px){.meeting-head{grid-template-columns:minmax(0,1fr) 28px}.meeting-row{grid-template-columns:minmax(0,1fr) 28px}.meeting-row .meeting-title{grid-column:1;grid-row:1}.meeting-row .meeting-mode-cell{grid-column:1;grid-row:2}.meeting-row .meeting-status-cell{grid-column:1;grid-row:3}.meeting-row .row-delete{grid-column:2;grid-row:1}.meeting-row .meeting-mode-cell .cell-select,.meeting-row .meeting-status-cell .cell-select{max-width:230px}.meeting-title-line{flex-wrap:wrap}.meeting-title-line>.cell-input{flex-basis:100%}}
    @media(max-width:520px){.app{padding:18px 14px 36px}header{margin-bottom:28px}.date-chip{display:none}.intro h1{font-size:26px}.intro{margin-bottom:19px}.section-title p{display:none}.toolbar{align-items:flex-start;flex-wrap:wrap}.actions{width:100%}.search{flex:1}.search input{width:100%}.summary{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px}.stat:last-child{display:none}.stat-value{font-size:19px}.tabs{margin-right:-14px}.list-card{overflow:hidden}.today-toggle{font-size:10px}}

<body>
  <div class="app">
    <header><div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">PRODUCTIVITY</div><div class="brand-caption">Your work, in good order</div></div></div><div class="header-right"><span class="date-chip" id="todayDate"></span><div class="backup-actions"><button id="exportData" type="button">Export data</button><button id="importData" type="button">Import data</button><input id="importFile" type="file" accept="application/json,.json" hidden></div><div class="avatar">EC</div></div></header>
    <section class="intro"><div><div class="eyebrow">A little more clarity</div><h1 id="greeting">Good morning.</h1><p>Keep the important things moving.</p></div><div class="today-note">One thing at a time. Your work is all here when you need it.</div></section>
    <nav class="tabs" id="tabs" aria-label="Workspace tabs"></nav><main id="content"></main>
  </div><div class="toast" id="toast" role="status"></div>
  <script>
    (() => {
      const TODO_PROGRESS = ['Started', 'In Progress', 'Done'];
      const MEETING_PROGRESS = ['On Me', 'Waiting', 'Times Sent', 'Sent', 'Done'];
      const PEOPLE = ['Alix', 'Jamie', 'Omar', 'Eduardo', 'A&R', 'Marketing'];
      const MEETING_OWNERS = ['Jamie', 'Alix', 'Omar', 'Eduardo'];
      const TABS = [{ id: 'todo', label: 'To Do List' }, ...MEETING_OWNERS.map(name => ({ id: name, label: `${name} Meetings` }))];
      const STORE_KEY = 'daymark-data-v1';
      const $ = selector => document.querySelector(selector);
      const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
      let active = 'todo';
      let query = '';
      let toastTimer;
      let dragMeta = null;
      let data = loadData();

      function defaults() {
        return {
          tasks: [],
          meetings: Object.fromEntries(MEETING_OWNERS.map(name => [name, []])),
          options: { todoProgress: [...TODO_PROGRESS], meetingProgress: [...MEETING_PROGRESS], people: [...PEOPLE] },
        };
      }
      function loadData() {
        let stored;
        try { stored = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (error) { stored = null; }
        const result = stored && Array.isArray(stored.tasks) && stored.meetings ? stored : defaults();
        MEETING_OWNERS.forEach(name => {
          if (!Array.isArray(result.meetings[name])) result.meetings[name] = [];
          result.meetings[name].forEach(meeting => {
            if (meeting.urgent === undefined) meeting.urgent = false;
            if (meeting.followUp === undefined) meeting.followUp = false;
            if (!meeting.mode) meeting.mode = '';
            if (!meeting.address) meeting.address = '';
          });
        });
        result.tasks.forEach(task => {
          if (task.today === undefined) task.today = false;
          if (task.urgent === undefined) task.urgent = false;
        });
        result.options = result.options || {};
        result.options.todoProgress = mergeOptions(TODO_PROGRESS, result.options.todoProgress);
        result.options.meetingProgress = mergeOptions(MEETING_PROGRESS, result.options.meetingProgress);
        result.options.people = mergeOptions(PEOPLE, result.options.people);
        try { localStorage.setItem(STORE_KEY, JSON.stringify(result)); } catch (error) { /* keep this session usable */ }
        return result;
      }
      function mergeOptions(required, saved) {
        return [...new Set([...required, ...(Array.isArray(saved) ? saved : [])])];
      }
      function persist() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (error) { /* keep this session usable */ }
      }
      function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
      function niceDay() { return new Intl.DateTimeFormat('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date()); }
      function counts() {
        return {
          todo: data.tasks.filter(task => task.status !== 'Done').length,
          ...Object.fromEntries(MEETING_OWNERS.map(name => [name, data.meetings[name].filter(meeting => meeting.status !== 'Done').length]))
        };
      }
      function renderTabs() {
        const currentCounts = counts();
        $('#tabs').innerHTML = TABS.map(tab => `<button class="tab ${active === tab.id ? 'active' : ''}" data-tab="${tab.id}">${tab.label}<span class="count">${currentCounts[tab.id] ?? 0}</span></button>`).join('');
      }
      function tone(status) {
        const known = ['Started', 'In Progress', 'Done', 'On Me', 'Waiting', 'Times Sent', 'Sent'];
        return known.includes(status) ? `tone-${status.toLowerCase().replaceAll(' ', '-')}` : 'tone-custom';
      }
      function priority(meeting) { return meeting.urgent ? 0 : meeting.followUp ? 1 : 2; }
      function optionsMarkup(options, selected, placeholder) {
        return `<option value="">${placeholder}</option>${options.map(option => `<option value="${esc(option)}" ${option === selected ? 'selected' : ''}>${esc(option)}</option>`).join('')}`;
      }
      function selectWithAdd(scope, field, selected, options, placeholder) {
        return `<div class="select-add-wrap"><select class="cell-select ${field === 'status' ? `progress-select ${tone(selected)}` : ''}" data-field="${field}" aria-label="${placeholder}">${optionsMarkup(options, selected, placeholder)}</select><button class="add-option" type="button" data-add-option="${scope}" aria-label="Add a ${placeholder.toLowerCase()} option" title="Add option">+</button></div>`;
      }
      function taskRow(task) {
        return `<div class="task-row ${task.urgent ? 'urgent-row' : ''}" data-kind="task" data-id="${esc(task.id)}"><span class="drag-handle" draggable="true" aria-label="Drag to reorder" title="Drag to reorder"></span>
          <div class="task-main"><input class="check" type="checkbox" data-field="complete" ${task.status === 'Done' ? 'checked' : ''} aria-label="Mark done"><button class="flag-button ${task.urgent ? 'on' : ''}" type="button" data-field="urgent" aria-label="${task.urgent ? 'Remove urgent flag' : 'Flag urgent'}" title="Flag urgent">⚑</button><div class="task-title-input"><input class="cell-input ${task.status === 'Done' ? 'completed' : ''}" data-field="title" placeholder="Activity name" value="${esc(task.title)}" aria-label="Activity name"><input class="cell-input task-notes" data-field="notes" placeholder="Notes" value="${esc(task.notes)}" aria-label="Notes"></div></div>
          <div class="boss-cell">${selectWithAdd('people', 'boss', task.boss, data.options.people, 'For Whom')}</div>
          <div class="status-cell">${selectWithAdd('todoProgress', 'status', task.status, data.options.todoProgress, 'Progress')}</div>
          <div class="deadline-cell"><input class="cell-input date-input" type="date" data-field="deadline" value="${esc(task.deadline)}" aria-label="Deadline"></div><div class="today-cell"><label class="today-toggle"><input type="checkbox" data-field="today" ${task.today ? 'checked' : ''}> Today</label></div><button type="button" class="row-delete" data-field="delete" aria-label="Delete row" title="Delete row">×</button>
        </div>`;
      }
      function meetingRow(meeting) {
        const rowTone = meeting.urgent ? 'urgent-row' : meeting.followUp ? 'followup-row' : '';
        return `<div class="task-row meeting-row ${rowTone}" data-kind="meeting" data-id="${esc(meeting.id)}"><span class="drag-handle" draggable="true" aria-label="Drag to reorder" title="Drag to reorder"></span>
          <div class="meeting-title"><div class="meeting-title-line"><input class="cell-input" data-field="title" placeholder="Meeting title" value="${esc(meeting.title)}" aria-label="Meeting title"><button class="flag-button ${meeting.urgent ? 'on' : ''}" type="button" data-field="urgent" aria-label="${meeting.urgent ? 'Remove urgent flag' : 'Flag meeting urgent'}" title="Flag urgent">⚑</button><button class="followup-button ${meeting.followUp ? 'on' : ''}" type="button" data-field="followUp" aria-pressed="${meeting.followUp ? 'true' : 'false'}">FOLLOW UP</button></div><input class="cell-input meeting-notes" data-field="notes" placeholder="Notes" value="${esc(meeting.notes)}" aria-label="Notes"></div>
          <div class="meeting-mode-cell"><select class="cell-select" data-field="mode" aria-label="Meeting type">${optionsMarkup(['Zoom', 'In Person', 'Call'], meeting.mode, 'Meeting type')}</select>${meeting.mode === 'In Person' ? `<input class="cell-input address-input" data-field="address" placeholder="Address" value="${esc(meeting.address)}" aria-label="Meeting address">` : ''}</div>
          <div class="meeting-status-cell">${selectWithAdd('meetingProgress', 'status', meeting.status, data.options.meetingProgress, 'Progress')}</div><button type="button" class="row-delete" data-field="delete" aria-label="Delete row" title="Delete row">×</button>
        </div>`;
      }
      function matches(item) { return `${item.title || ''} ${item.notes || ''} ${item.boss || ''} ${item.status || ''} ${item.address || ''}`.toLowerCase().includes(query.toLowerCase()); }
      function todoView() {
        const all = data.tasks;
        const today = all.filter(task => task.today && matches(task));
        const other = all.filter(task => !task.today && matches(task));
        const open = all.filter(task => task.status !== 'Done').length;
        const urgent = all.filter(task => task.urgent && task.status !== 'Done').length;
        const done = all.filter(task => task.status === 'Done').length;
        return `<div class="toolbar"><div class="section-title"><div><h2>To Do List</h2><p>Type right into a row. Click + whenever you need another.</p></div></div><div class="actions"><div class="search"><span class="search-icon">⌕</span><input id="searchInput" placeholder="Find an activity…" value="${esc(query)}"></div></div></div>
          <div class="summary"><div class="stat"><div><div class="stat-label">Still to do</div><div class="stat-value">${open}</div></div><span class="stat-icon ic-green">☷</span></div><div class="stat"><div><div class="stat-label">Urgent</div><div class="stat-value">${urgent}</div></div><span class="stat-icon ic-amber">⚑</span></div><div class="stat"><div><div class="stat-label">Completed</div><div class="stat-value">${done}</div></div><span class="stat-icon ic-blue">✓</span></div></div>
          <div class="list-card"><div class="list-head"><span>Activity</span><span>For Whom</span><span>Progress</span><span>Deadline</span><span>Today</span><span></span></div>${today.length ? `<div class="today-section"><div class="section-label">Today <span>${today.length}</span></div>${today.map(taskRow).join('')}</div>` : ''}${other.map(taskRow).join('')}${!today.length && !other.length ? `<div class="empty">${query ? 'No matching rows.' : 'Nothing on the list yet. Click + to add a row.'}</div>` : ''}<button class="add-row" type="button" data-add="task"><span class="add-plus">＋</span>Add a row</button></div>`;
      }
      function meetingView() {
        const items = data.meetings[active];
        const filtered = items.filter(matches).map((meeting, index) => ({ meeting, index })).sort((a, b) => priority(a.meeting) - priority(b.meeting) || a.index - b.index).map(entry => entry.meeting);
        const done = items.filter(item => item.status === 'Done').length;
        const waiting = items.filter(item => item.status === 'Waiting').length;
        const onMe = items.filter(item => item.status === 'On Me').length;
        return `<div class="toolbar"><div class="section-title"><div><h2>${active} Meetings</h2><p>Type directly into a row. Use + to add another.</p></div></div><div class="actions"><div class="search"><span class="search-icon">⌕</span><input id="searchInput" placeholder="Find a meeting…" value="${esc(query)}"></div></div></div>
          <div class="meeting-summary"><div class="mini"><b>${items.length}</b> total</div><div class="mini"><b>${onMe}</b> on me</div><div class="mini"><b>${waiting}</b> waiting</div><div class="mini"><b>${done}</b> done</div></div>
          <div class="list-card"><div class="list-head meeting-head"><span>Meeting &amp; notes</span><span>Meeting type</span><span>Progress</span><span></span></div>${filtered.map(meetingRow).join('')}${!filtered.length ? `<div class="empty">${query ? 'No matching rows.' : 'Nothing here yet. Click + to add a row.'}</div>` : ''}<button class="add-row" type="button" data-add="meeting"><span class="add-plus">＋</span>Add a row</button></div>`;
      }
      function render(focusId = null) {
        renderTabs();
        $('#content').innerHTML = active === 'todo' ? todoView() : meetingView();
        wire();
        if (focusId) {
          const input = document.querySelector(`[data-id="${CSS.escape(focusId)}"] [data-field="title"]`);
          if (input) { input.focus(); input.scrollIntoView({ block: 'nearest' }); }
        }
      }
      function wire() {
        document.querySelectorAll('[data-tab]').forEach(button => button.onclick = () => { active = button.dataset.tab; query = ''; render(); });
        const search = $('#searchInput');
        search.oninput = () => { const position = search.selectionStart; query = search.value; render(); const next = $('#searchInput'); next.focus(); next.setSelectionRange(position, position); };
        $('#content').querySelectorAll('[data-add]').forEach(button => button.onclick = () => {
          const isTask = button.dataset.add === 'task';
          const item = isTask
            ? { id: newId(), title: '', notes: '', status: '', boss: '', deadline: '', urgent: false, today: false }
            : { id: newId(), title: '', notes: '', status: '', urgent: false, followUp: false, mode: '', address: '' };
          if (isTask) data.tasks.push(item); else data.meetings[active].push(item);
          persist(); render(item.id);
        });
        $('#content').querySelectorAll('.task-row').forEach(row => {
          const item = row.dataset.kind === 'task' ? data.tasks.find(task => task.id === row.dataset.id) : data.meetings[active].find(meeting => meeting.id === row.dataset.id);
          if (!item) return;
          row.querySelectorAll('[data-field]').forEach(element => {
            const field = element.dataset.field;
            if (field === 'delete') {
              element.onclick = () => { if (row.dataset.kind === 'task') data.tasks = data.tasks.filter(task => task.id !== item.id); else data.meetings[active] = data.meetings[active].filter(meeting => meeting.id !== item.id); persist(); render(); };
              return;
            }
            if (field === 'urgent' || field === 'followUp') {
              element.onclick = () => { item[field] = !item[field]; persist(); render(); };
              return;
            }
            if (field === 'complete') { element.onchange = () => { item.status = element.checked ? 'Done' : 'Started'; persist(); render(); }; return; }
            if (field === 'today') { element.onchange = () => { item.today = element.checked; persist(); render(); }; return; }
            if (element.tagName === 'SELECT' || element.type === 'date') { element.onchange = () => { item[field] = element.value; persist(); render(); }; return; }
            element.oninput = () => { item[field] = element.value; persist(); };
            element.onblur = () => { item[field] = element.value.trim(); persist(); };
          });
        });
        $('#content').querySelectorAll('.drag-handle').forEach(handle => {
          handle.ondragstart = event => {
            const row = handle.closest('.task-row');
            dragMeta = { id: row.dataset.id, kind: row.dataset.kind, owner: active };
            event.dataTransfer.effectAllowed = 'move';
            event.dataTransfer.setData('text/plain', dragMeta.id);
            row.classList.add('dragging');
          };
          handle.ondragend = () => {
            document.querySelectorAll('.dragging,.drag-target').forEach(row => row.classList.remove('dragging', 'drag-target'));
            dragMeta = null;
          };
        });
        $('#content').querySelectorAll('.task-row').forEach(row => {
          row.ondragover = event => {
            if (!dragMeta || dragMeta.kind !== row.dataset.kind || dragMeta.id === row.dataset.id || (dragMeta.kind === 'meeting' && dragMeta.owner !== active)) return;
            event.preventDefault();
            event.dataTransfer.dropEffect = 'move';
            row.classList.add('drag-target');
          };
          row.ondragleave = event => { if (!row.contains(event.relatedTarget)) row.classList.remove('drag-target'); };
          row.ondrop = event => {
            if (!dragMeta || dragMeta.kind !== row.dataset.kind || dragMeta.id === row.dataset.id || (dragMeta.kind === 'meeting' && dragMeta.owner !== active)) return;
            event.preventDefault();
            const list = dragMeta.kind === 'task' ? data.tasks : data.meetings[active];
            const sourceIndex = list.findIndex(item => item.id === dragMeta.id);
            const target = list.find(item => item.id === row.dataset.id);
            if (sourceIndex < 0 || !target) return;
            const [moved] = list.splice(sourceIndex, 1);
            if (dragMeta.kind === 'task') moved.today = target.today;
            const targetIndex = list.findIndex(item => item.id === target.id);
            const insertAfter = event.clientY > row.getBoundingClientRect().top + row.getBoundingClientRect().height / 2;
            list.splice(targetIndex + (insertAfter ? 1 : 0), 0, moved);
            persist();
            dragMeta = null;
            render();
          };
        });
        $('#content').querySelectorAll('[data-add-option]').forEach(button => button.onclick = () => openOptionEditor(button));
      }
      function openOptionEditor(button) {
        const scope = button.dataset.addOption;
        const wrap = button.closest('.select-add-wrap');
        if (wrap.querySelector('.option-editor')) return;
        const placeholder = scope === 'people' ? 'New person' : 'New progress option';
        wrap.insertAdjacentHTML('beforeend', `<form class="option-editor"><input aria-label="${placeholder}" placeholder="${placeholder}" maxlength="40"><button type="submit">Add</button><button type="button" class="cancel-option" aria-label="Cancel">×</button></form>`);
        const form = wrap.querySelector('.option-editor');
        const input = form.querySelector('input');
        input.focus();
        form.querySelector('.cancel-option').onclick = () => form.remove();
        form.onsubmit = event => {
          event.preventDefault();
          const value = input.value.trim();
          if (!value) { input.focus(); return; }
          const list = data.options[scope];
          const existing = list.find(option => option.toLowerCase() === value.toLowerCase());
          const option = existing || value;
          if (!existing) list.push(option);
          const field = scope === 'people' ? 'boss' : 'status';
          const row = button.closest('.task-row');
          const item = row.dataset.kind === 'task' ? data.tasks.find(task => task.id === row.dataset.id) : data.meetings[active].find(meeting => meeting.id === row.dataset.id);
          item[field] = option;
          persist(); render();
        };
      }
      $('#exportData').onclick = () => {
        const file = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(file);
        link.download = `productivity-backup-${new Date().toISOString().slice(0, 10)}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      };
      $('#importData').onclick = () => $('#importFile').click();
      $('#importFile').onchange = async event => {
        const file = event.target.files[0];
        if (!file) return;
        try {
          const imported = JSON.parse(await file.text());
          if (!Array.isArray(imported.tasks) || !imported.meetings || typeof imported.meetings !== 'object') throw new Error('Invalid backup');
          localStorage.setItem(STORE_KEY, JSON.stringify(imported));
          data = loadData();
          render();
          $('#toast').textContent = 'Your data was imported.';
          $('#toast').classList.add('show');
          setTimeout(() => $('#toast').classList.remove('show'), 2200);
        } catch (error) {
          $('#toast').textContent = 'Could not import that backup file.';
          $('#toast').classList.add('show');
          setTimeout(() => $('#toast').classList.remove('show'), 2500);
        } finally { event.target.value = ''; }
      };
      $('#todayDate').textContent = niceDay();
      const hour = new Date().getHours();
      $('#greeting').textContent = hour < 12 ? 'Good morning.' : hour < 18 ? 'Good afternoon.' : 'Good evening.';
      render();
    })();
  </script>
</body>
</html>
